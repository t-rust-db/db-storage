[package]
name = "db-storage"
version = "0.4.1"
edition = "2021"

[lib]
name = "db_storage"
path = "src/lib.rs"

[[bin]]
name = "lock_probe"
path = "src/row/vfs/bin/lock_probe.rs"
required-features = ["row"]

[features]
default = ["column"]
column = []
row = []
# Test-support helpers (e.g. `row::btree::test_minimal_db`) for consumers'
# own test suites — enable from `[dev-dependencies]` only (#13).
test-support = []

[dependencies]
memmap2 = "0.9.11"
ruzstd = "0.7"
